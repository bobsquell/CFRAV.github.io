server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — renvoie toujours index.html pour les routes SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long sur les assets Vite (hash dans le nom de fichier)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
